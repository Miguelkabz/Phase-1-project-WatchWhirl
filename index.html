<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchWhirl</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Hover.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1 class="animate__animated animate__fadeInDown">🎬 WatchWhirl</h1>
      <p class="tagline">Tap, spin, and stream the unknown</p>
    </header>

    <div class="controls">
      <button id="pick-movie" class="hvr-bounce-in">
        <i class="fa-solid fa-shuffle"></i> Random Movie
      </button>

      <form id="search-form">
        <input type="text" id="search-input" placeholder="Search for a movie..." />
        <button type="submit" class="hvr-grow">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
      </form>

      <label class="switch">
        <input type="checkbox" id="dark-toggle" />
        <span class="slider"></span> 🌙
      </label>
    </div>

    <main>
      <div id="movie-display" class="animate__animated animate__fadeIn">
        <h2 id="movie-title">Your Movie Title Here</h2>
        <img id="movie-poster" src="" alt="Movie Poster" />
        <p id="movie-overview">Movie overview will be displayed here.</p>
        <p id="movie-rating"></p>
        <p id="movie-genres"></p>
      </div>

      <div id="error-message"></div>
      <div id="loading-spinner">Loading...</div>

      <div id="search-results" style="display: none;">
        <h3>Search Results:</h3>
        <ul id="results-list"></ul>
      </div>
    </main>

    <footer>
      <p>🎥 Made by Miguel Kabue Gicheru | Powered by TMDb </p>
    </footer>
  </div>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Custom JS -->
  <script src="./movie.js"></script>
</body>
</html>
