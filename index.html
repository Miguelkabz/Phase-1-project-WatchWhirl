<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Movie Picker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎥 WatchWhirl</h1>
    <p class="tagline">Find your next favorite movie!</p>
    
    <div class="toggle-container">
      <label for="dark-toggle">🌙 Dark Mode</label>
      <input type="checkbox" id="dark-toggle">
    </div>
  </header>

  <main>
    <section id="controls">
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Search for a movie..." />
        <button type="submit">Search</button>
      </form>
      <button id="pick-movie">🎲 Pick Random Movie</button>
    </section>

    <section id="loading-spinner" class="hidden">Loading...</section>
    <section id="error-message"></section>

    <section id="movie-display" class="hidden">
      <h2 id="movie-title"></h2>
      <img id="movie-poster" alt="Movie Poster" />
      <p id="movie-overview"></p>
    </section>

    <section id="search-results" class="hidden">
      <h3>Search Results:</h3>
      <ul id="results-list"></ul>
    </section>
  </main>

  <footer>
    <p>© 2025 Movie Picker</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
