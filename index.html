<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchWhirl</title>
</head>
<body>
    <header>
       <h1>WatchWhirl</h1>
       <p>Can’t decide what to watch? Let WatchWhirl spin the reel for you!</p>
    </header>

    <main> 
      <div class="controls">
      <button id="pick-movie">🎞 Random Movie</button>


      <form id="search-form">
        <input type="text" id="search-input" placeholder="Search for a movie..." />
        <button type="submit">🔍 Search</button>
      </form>

      <label class="switch">
        <input type="checkbox" id="dark-toggle" />
        <span class="slider"></span> 🌙
      </label>

    </div>

        <div id="movie-display">
            <h2 id="movie-title">Your Movie Title Here</h2>
            <img id="movie-poster" src="" alt="Movie Poster" />
            <p id="movie-overview">Movie overview will be displayed here.</p>
        </div>
    
        <div id="error-message" style="color: red;"></div>
    
        <div id="loading-spinner" style="display: none;">Loading...</div>
    
        <div id="search-results" style="display: none;">
            <h3>Search Results:</h3>
            <ul id="results-list"></ul>
        </div>
      
    </main>
    <footer> 
      <p>Powered by TMDB API 🎬 | Made by Miguel Kabue</p>
    </footer>
</body>
</html>
