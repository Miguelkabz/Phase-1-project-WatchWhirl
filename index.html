<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchWhirl</title>
</head>
<body>
    <header>
       <h1>WatchWhirl</h1>
       <p>Find, explore and enjoy movies and TV shows</p>S
    </header>

    <main> 

      <div class="controls">
      <input type="text" id="searchInput" placeholder="Enter movie title..." />
      <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
      <button id="randomBtn"><i class="fa-solid fa-shuffle"></i> Random</button>
      <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
    </div>

     <section id="movieContainer" class="movie-container">
      <p>Start by searching for a movie or click 🎲 Random!</p>
    </section>
    
    </main>
    <footer> 

    </footer>
</body>
